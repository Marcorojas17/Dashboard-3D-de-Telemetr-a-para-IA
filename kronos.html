<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRONOS · Verificador</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05040a;color:#e3def2;font-family:system-ui;padding:16px;min-height:100vh}
#bg{position:fixed;inset:0;z-index:0;opacity:.5;pointer-events:none}
.w{max-width:700px;margin:auto;position:relative;z-index:1}
h1{font-size:1.4rem;color:#ff9f1c;margin-bottom:4px}
h2{font-size:1.1rem;color:#ff9f1c;margin-bottom:6px}
.card{background:rgba(16,12,32,.7);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:16px;margin:12px 0}
.drop{border:2px dashed rgba(255,159,28,.3);border-radius:8px;padding:20px;text-align:center;cursor:pointer;margin-top:8px}
.drop:hover{border-color:#ff9f1c}
.hash{background:#000;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:12px;font-family:monospace;font-size:11px;word-break:break-all;color:#ff9f1c;margin-top:10px;min-height:36px}
button{background:#ff9f1c;border:none;color:#000;padding:10px 18px;border-radius:8px;font-weight:700;cursor:pointer;margin:6px 6px 0 0;font-size:13px}
button:disabled{opacity:.3;cursor:not-allowed}
textarea{width:100%;background:#000;border:1px solid rgba(255,255,255,.1);border-radius:8px;color:#fff;font-family:monospace;font-size:12px;padding:10px;margin-top:6px;min-height:60px}
.result{padding:14px;border-radius:8px;text-align:center;font-weight:700;margin-top:12px;display:none}
.match{background:rgba(0,255,102,.1);border:2px solid #00ff66;color:#00ff66;display:block}
.nomatch{background:rgba(255,0,85,.1);border:2px solid #ff0055;color:#ff0055;display:block}
small{font-size:10px;font-family:monospace;display:block;margin-top:6px;font-weight:400;word-break:break-all}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="w">
<h1>🔐 KRONOS</h1>
<p style="color:#6e658a;font-size:12px">Verificador de integridad · v12</p>
<div class="card">
<h2>1. Hash de archivo</h2>
<div class="drop" id="d1">📄 Toca para elegir<input type="file" id="i1" style="display:none"></div>
<div class="hash" id="o1">—</div>
<button id="b1" disabled>Calcular SHA-256</button>
<button id="b2" disabled>Descargar recibo</button>
</div>
<div class="card">
<h2>2. Verificar archivo</h2>
<textarea id="exp" placeholder="Pega aquí el hash de 64 caracteres que guardaste" rows="2"></textarea>
<div class="drop" id="d2">📄 Toca para elegir el archivo<input type="file" id="i2" style="display:none"></div>
<button id="b3" disabled>Verificar integridad</button>
<div class="result" id="r1"></div>
</div>
</div>
<script>
(function(){
'use strict';
var K=new Uint32Array([
0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function rotr(v,n){return((v>>>n)|(v<<(32-n)))>>>0}
function sha256p(d){
var m=typeof d==='string'?new TextEncoder().encode(d):new Uint8Array(d);
var l=m.length;var pad=new Uint8Array(l+1+((56-(l+1)%64)+64)%64+8);
pad.set(m);pad[l]=0x80;var dv=new DataView(pad.buffer);var bl=l*8;
dv.setUint32(pad.length-8,Math.floor(bl/0x100000000),false);
dv.setUint32(pad.length-4,bl>>>0,false);
var H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
var w=new Uint32Array(64);
for(var i=0;i<pad.length;i+=64){
for(var j=0;j<16;j++)w[j]=dv.getUint32(i+j*4,false);
for(var j=16;j<64;j++){
var s0=rotr(w[j-15],7)^rotr(w[j-15],18)^(w[j-15]>>>3);
var s1=rotr(w[j-2],17)^rotr(w[j-2],19)^(w[j-2]>>>10);
w[j]=(w[j-16]+s0+w[j-7]+s1)>>>0}
var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
for(var j=0;j<64;j++){
var S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
var ch=(e&f)^(~e&g);
var t1=(h+S1+ch+K[j]+w[j])>>>0;
var S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
var mj=(a&b)^(a&c)^(b&c);
var t2=(S0+mj)>>>0;
h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;
H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0}
var out='';for(var i=0;i<8;i++)out+=H[i].toString(16).padStart(8,'0');
return out}
var hasSub=!!(window.crypto&&window.crypto.subtle);
async function hashHex(buf){
if(hasSub){try{var h=await crypto.subtle.digest('SHA-256',buf);
return Array.from(new Uint8Array(h)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}catch(e){}}
return sha256p(buf)}
var cv=document.getElementById('bg'),cx=cv.getContext('2d'),CH='0123456789ABCDEF',cols,dr;
function ini(){cv.width=innerWidth;cv.height=innerHeight;cols=Math.floor(cv.width/16);
dr=Array(cols).fill(0).map(function(){return Math.random()*-50})}
ini();addEventListener('resize',ini);
setInterval(function(){cx.fillStyle='rgba(5,4,10,.1)';cx.fillRect(0,0,cv.width,cv.height);
cx.font='13px monospace';for(var i=0;i<cols;i++){
cx.fillStyle=Math.random()>.95?'rgba(255,159,28,.6)':'rgba(255,159,28,.15)';
cx.fillText(CH[Math.floor(Math.random()*16)],i*16,dr[i]*16);
if(dr[i]*16>cv.height&&Math.random()>.97)dr[i]=0;dr[i]++}},80);
var f1=null,h1=null,f2=null;
var d1=document.getElementById('d1'),i1=document.getElementById('i1');
var d2=document.getElementById('d2'),i2=document.getElementById('i2');
d1.onclick=function(){i1.click()};
d2.onclick=function(){i2.click()};
i1.onchange=function(){if(i1.files[0]){f1=i1.files[0];d1.innerHTML='📄 '+f1.name;
document.getElementById('b1').disabled=false;
document.getElementById('b2').disabled=true;
document.getElementById('o1').textContent='—'}};
i2.onchange=function(){if(i2.files[0]){f2=i2.files[0];d2.innerHTML='📄 '+f2.name;
document.getElementById('b3').disabled=false;
document.getElementById('r1').className='result'}};
document.getElementById('b1').onclick=async function(){
if(!f1)return;var btn=document.getElementById('b1');btn.disabled=true;btn.textContent='...';
var buf=await f1.arrayBuffer();h1=await hashHex(buf);
document.getElementById('o1').textContent=h1;btn.disabled=false;
btn.textContent='Calcular SHA-256';document.getElementById('b2').disabled=false};
document.getElementById('b2').onclick=function(){
if(!h1)return;var t='KRONOS RECIBO\nArchivo: '+f1.name+'\nTamaño: '+f1.size+' bytes\nSHA-256: '+h1+'\nFecha: '+new Date().toISOString()+'\n\nPrueba técnica, no legal.';
var b=new Blob([t],{type:'text/plain'});var a=document.createElement('a');
a.href=URL.createObjectURL(b);a.download=f1.name+'.sha256.txt';a.click()};
document.getElementById('b3').onclick=async function(){
if(!f2)return;var exp=document.getElementById('exp').value.trim().toLowerCase();
if(!/^[0-9a-f]{64}$/.test(exp)){alert('Hash debe ser 64 caracteres hex');return}
var buf=await f2.arrayBuffer();var cmp=await hashHex(buf);
var r=document.getElementById('r1');
if(cmp===exp){r.className='result match';r.innerHTML='✅ MATCH<small>'+cmp+'</small>'}
else{r.className='result nomatch';r.innerHTML='❌ NO MATCH<small>Esperado: '+exp+'<br>Obtenido: '+cmp+'</small>'}};
})();
</script>
</body>
</html>
